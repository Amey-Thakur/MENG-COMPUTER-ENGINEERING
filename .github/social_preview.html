  :root{
    --paper:#FAFBFC; --ink:#131110; --soft:#463F31; --faint:#524A3D; --hair:rgba(19,17,16,.19);
    --mumbai:#A6192E; --windsor:#005596; --slate:#2F3E4A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#D3CCBE;font-family:AR,-apple-system,sans-serif;color:#131110;padding:34px 22px 96px}
  .wrap{max-width:1340px;margin:0 auto}
  h1{font-size:26px;font-weight:600;line-height:1.3;margin-bottom:10px}
  .lede{color:#464031;font-size:14.5px;line-height:1.72;max-width:920px}
  .note{margin-top:14px;padding:14px 18px;background:rgba(255,255,255,.55);border-left:3px solid #A6192E;
        font-size:13px;line-height:1.7;color:#3F3A2C;max-width:920px}
  .label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#4F4938;margin:50px 0 8px}
  .cap{font-size:12.5px;color:#4F4938;margin-bottom:13px;line-height:1.6;max-width:920px}
  .stage{width:100%;max-width:1280px;aspect-ratio:2/1;box-shadow:0 20px 54px rgba(0,0,0,.26);overflow:hidden;background:#FAF7F0}

/* ================= EXACT GRID (unchanged from v10) =================
   card 1280x640 · spine 12 · padding 54 / 60 / 52 / 72 · content 1148x534
   V: 54 + 88 + 22 + 1 + [332] + 1 + 22 + 68 + 52 = 640
   H: 780 title col + 56 gutter + 312 rail = 1148   (rail el = 368)
   =================================================================== */
  .card{width:1280px;height:640px;transform-origin:top left;position:relative;overflow:hidden;
        padding:54px 60px 52px 72px;display:flex;flex-direction:column;
        background:radial-gradient(105% 80% at 78% 3%,rgba(253,249,239,.55),rgba(253,249,239,0) 62%),
                   radial-gradient(85% 78% at 2% 97%,rgba(132,108,72,.13),rgba(132,108,72,0) 66%),
                   radial-gradient(125% 105% at 50% 50%,rgba(0,0,0,0) 52%,rgba(96,76,48,.07) 100%),
                   var(--paper)}
  .spine{position:absolute;left:0;top:0;width:12px;height:100%;background:linear-gradient(180deg,#005596 0 68%,#FFCE00 68% 100%);z-index:2}
  .wm{position:absolute;z-index:0;pointer-events:none;opacity:0.10;
      left:1036px;top:320px;transform:translate(-50%,-50%);width:404px;height:auto;object-fit:contain}
  .card > *:not(.wm):not(.spine){position:relative;z-index:1}

  .top{height:88px;flex:0 0 88px;display:flex;align-items:center;justify-content:space-between;gap:28px}
  .est{display:flex;align-items:center;gap:22px}
  .crest{height:88px;width:auto;object-fit:contain;display:block}

  /* institution name: set NORMALLY. no stretched tracking anywhere. */
  .estt .l1{display:block;white-space:nowrap;font-size:23px;font-weight:600;letter-spacing:.005em;line-height:1.1}
  .estt .l2{display:block;white-space:nowrap;font-weight:400;letter-spacing:.005em;color:var(--faint);
            font-size:14px;margin-top:9px;line-height:1.2}
  /* Mumbai's name is the GENUINE wordmark, set in Old English Text MT and
     rendered once to a raster. The font file is never shipped, only this image. */
  .mu .l1{font-size:0;line-height:0}
  .mu .wmk{display:block;width:260px;height:auto}   /* width is overwritten at runtime to match line 2 exactly */
  .mu .l2{font-family:EBG,serif;font-size:22px;letter-spacing:.005em}
  /* Windsor's wordmark is DIN, which Archivo matches */
  .wi .l1{font-family:AR,sans-serif;font-size:25px;font-weight:600}
  .wi .l2{font-family:AR,sans-serif}

  .kind{font-size:18px;font-weight:600;letter-spacing:.15em;color:var(--accent);text-transform:uppercase;white-space:nowrap}
  .g22{height:22px;flex:0 0 22px}
  .rule{height:1px;flex:0 0 1px;background:var(--hair)}

  .mid{flex:0 0 332px;height:332px;display:grid;grid-template-columns:780px 368px;align-items:center}
  .titlebox{padding-right:30px}
  .title{font-size:84px;line-height:1.04;font-weight:500;letter-spacing:-.032em}
  .title span{display:block}
  .t70 .title{font-size:70px}
  .t58 .title{font-size:58px;line-height:1.08}
  /* Mumbai titles in a period serif; Windsor titles in the DIN-lineage sans */
  .ser-ebg .title{font-family:EBG,serif;font-weight:600;letter-spacing:-.014em;font-size:88px}
  .ser-ebg.t58 .title{font-size:62px}
  .ser-lbv .title{font-family:LBV,serif;font-weight:400;letter-spacing:-.022em;font-size:74px;line-height:1.1}
  .ser-pfd .title{font-family:PFD,serif;font-weight:500;letter-spacing:-.018em;font-size:82px}

  .rail{border-left:1px solid var(--hair);padding-left:56px;display:flex;flex-direction:column;gap:21px}
  .k{font-size:14px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
  .v{font-size:24px;font-weight:500;line-height:1.26;margin-top:8px;letter-spacing:-.006em}
  .v.acc{color:var(--accent);letter-spacing:.02em;font-weight:600;font-size:23px}

  .foot{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;gap:28px}
  .by{display:flex;align-items:center;gap:18px}
  .sq{display:flex;gap:8px}
  .sq img{width:68px;height:68px;object-fit:cover;display:block;background:#fff;border:1px solid var(--hair)}
  .who{font-size:20px;font-weight:500;line-height:1.3}
  .who em{display:block;font-style:normal;font-size:16px;font-weight:400;color:var(--faint);letter-spacing:.01em;margin-top:5px}
  .orc{text-align:right;white-space:nowrap}
  .who a,.orc a{color:inherit;text-decoration:none}
  .who a:hover,.orc a:hover{text-decoration:underline}
  .orc b{display:block;font-size:14px;font-weight:600;color:var(--faint);letter-spacing:.13em;text-transform:uppercase;margin-bottom:5px}
  .orc span{font-size:20px;font-weight:500;letter-spacing:.01em;color:var(--soft)}

html,body{margin:0;padding:0;background:#F6F2E8;width:1280px;height:640px;overflow:hidden}
.stage{width:1280px !important;max-width:none !important;aspect-ratio:auto !important;box-shadow:none !important}
.card{transform:none !important}
